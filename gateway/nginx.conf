events {
  worker_connections 1024;
}

http {
  upstream backend {
    server backend:8081;
  }

  limit_req_zone $binary_remote_addr zone=code_ip:10m rate=5r/m;
  limit_req_zone $binary_remote_addr zone=login_ip:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=order_ip:20m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=api_ip:20m rate=60r/s;

  server {
    listen 8080;
    server_name _;

    limit_req_status 429;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_next_upstream off;

    location = /api/user/code {
      limit_req zone=code_ip burst=2 nodelay;
      proxy_pass http://backend;
    }

    location = /api/user/login {
      limit_req zone=login_ip burst=5 nodelay;
      proxy_pass http://backend;
    }

    location ^~ /api/voucher-order/ {
      limit_req zone=order_ip burst=30 nodelay;
      proxy_pass http://backend;
    }

    location ^~ /api/ {
      limit_req zone=api_ip burst=120 nodelay;
      proxy_pass http://backend;
    }

    location / {
      return 404;
    }
  }
}
